<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Components</title>
  <link rel="stylesheet" href="componets.css">
</head>
<body>
  <nav>
    <a href="main.html">Home</a>
    <a href="blog.html">Blog</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="components.html">Components</a>
  </nav>

  <main>
    <h1>Components</h1>
    <p>Small reusable pieces you can copy into other pages.</p>

    <div class="box">
      <h2>Buttons</h2>
      <button type="button">Save</button>
      <button class="ghost" type="button">Cancel</button>
    </div>

    <div class="box">
      <h2>Card</h2>
      <p>A card is just a box with a border, padding, and a title inside.</p>
    </div>

    <div class="box">
      <h2>Form</h2>
      <form>
        <label for="name">Name</label>
        <input id="name" type="text" placeholder="Your name">
        <button type="button">Send</button>
      </form>
    </div>
  </main>
</body>
</html>
